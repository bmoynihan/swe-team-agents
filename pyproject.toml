[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-team-agents"
version = "0.1.0"
description = "Manager-led multi-agent software engineering template"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "swe-team-agents-template contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.6",
  "mypy>=1.10"
]

[project.scripts]
swe-team-agents = "swe_team_agents.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = '(^docs/agents/runs/|^generated/|^\.tmp/)'
