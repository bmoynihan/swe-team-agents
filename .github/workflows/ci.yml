name: CI

on:
  push:
    branches:
      - main
      - "copilot/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate agent path policy
        run: bash ./scripts/ci/check_agent_paths.sh

      - name: Run quick checks
        run: bash ./scripts/ci/quick_test.sh

      - name: Run full checks
        run: bash ./scripts/ci/full_test.sh


